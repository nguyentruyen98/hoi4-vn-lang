 AGENCY_DEFENSE_LEVEL_DESC:0 "Phản tình báo được sử dụng để cản trở Điệp viên địch. Càng cao thì càng có khả năng ngăn chặn Điệp viên và càng lâu và đắt đỏ hơn để thực hiện Hoạt động chống lại bạn."
