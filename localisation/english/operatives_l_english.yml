 BECOME_SPY_MASTER_ALREADY_MASTER:0 "§RBạn đã là Thủ lĩnh Tình báo rồi.§!"
 BECOME_SPY_MASTER_FACTION_NEEDED:0 "§RBạn cần gia nhập một phe để trở thành Thủ lĩnh Tình báo.§!"
 BECOME_SPY_MASTER_UPGRADES_NEEDED:1 "§RBạn cần có cơ quan tình báo với $NUMBER$ nâng cấp chi nhánh khác nhau để trở thành Thủ lĩnh Tình báo.§!"
 BECOME_SPY_MASTER_NO_SUBJECT:0 "§RCác quốc gia chư hầu không thể trở thành Thủ lĩnh Tình báo.§!"
 BECOME_SPY_MASTER_COOLDOWN:0 "§RMột quốc gia khác đã trở thành Thủ lĩnh Tình báo của phe chúng ta chưa đầy $COOLDOWN|H$ ngày. Chúng ta phải đợi đến $DATE|H$ trước khi có thể trở thành Thủ lĩnh Tình báo.§!"
 BECOME_SPY_MASTER_COST:1 "Sẽ tốn £pol_power $VALUE$ để trở thành §HThủ lĩnh Tình báo§!."
 BECOME_SPY_MASTER_DESC:0 "Với tư cách §HThủ lĩnh Tình báo§!, bạn có thể điều khiển nhiều Điệp viên hơn, số lượng phụ thuộc vào quy mô Phe của bạn.\nChỉ có thể có một §HThủ lĩnh Tình báo§! mỗi phe và nếu phe của bạn đã có §HThủ lĩnh Tình báo§!, họ phải chấp thuận để bạn tiếp quản."
