 branch_intelligence:0 "Tình báo"
 branch_defense:0 "Phòng thủ"
 branch_operation:0 "Hoạt động"
 branch_operative:0 "Huấn luyện Điệp viên"
 branch_crypto:0 "Phòng Mật mã học"
 upgrade_economy_civilian:0 "Kinh tế/dân sự"
 upgrade_economy_civilian_desc:0 "§LCác đặc vụ của chúng ta sẽ được huấn luyện để đóng vai trò dân thường trên lãnh thổ địch và hoạt động trong các lĩnh vực công nghiệp và dân sự; thu thập tình báo về công nghiệp và kinh tế của kẻ thù.§!"
 upgrade_army_department:0 "Phòng Lục quân"
 upgrade_army_department_desc:0 "§LTình báo quân sự của kẻ thù có tầm quan trọng hàng đầu và cần thiết phải thành lập phòng tình báo quân sự. Các điệp viên của chúng ta sẽ được huấn luyện để xâm nhập quân đội địch, đóng vai binh lính và tướng lĩnh và báo cáo cho chúng ta những bí mật họ tìm thấy sau chiến tuyến địch.§!"
 upgrade_naval_department:0 "Phòng Hải quân"
 upgrade_naval_department_desc:0 "§LTrận chiến trên biển là một phần quan trọng để đảm bảo chiến thắng, và với sự tiến bộ của công nghệ hải quân, việc thành lập Phòng Tình báo Hải quân đã trở nên thiết yếu.§!"
 upgrade_airforce_department:0 "Phòng Không quân"
 upgrade_airforce_department_desc:0 "§LPhòng Tình báo Hàng không sẽ là một chi nhánh hữu ích của cơ quan chúng ta; chịu trách nhiệm xâm nhập không quân địch và thu thập tình báo về hoạt động máy bay địch.§!"
 upgrade_passive_defense:0 "Phòng thủ thụ động"
 upgrade_passive_defense_desc:1 "§LLực lượng Bảo vệ Quê hương có tiềm năng trở thành công cụ quan trọng cho tình báo của chúng ta. Bằng cách huấn luyện Lực lượng Bảo vệ Quê hương và quân đồn trú về phương pháp gián điệp và phản tình báo, chúng ta sẽ đảm bảo rằng chúng ta luôn có sự hiện diện phòng thủ tại quê nhà, ngay cả khi các chuyên gia của chúng ta bận rộn việc khác.§!"
 upgrade_anti_partisan:0 "Chống du kích"
 upgrade_anti_partisan_desc:0 "§LTuyên truyền là công cụ mạnh mẽ để đảm bảo lòng trung thành của công dân chúng ta, nhưng tạo ra sự tuân thủ ở đất địch phức tạp hơn nhiều. Bằng cách huấn luyện các điệp viên xâm nhập phong trào kháng chiến địch, chúng ta có thể bắt đầu thực hiện các vụ bắt giữ hiệu quả và chấm dứt hoạt động phá hoại của họ. Chắc chắn rằng, các du kích nước ngoài sẽ mất hy vọng trở về chế độ cũ.§!"
 upgrade_blueprint_stealing:0 "Đánh cắp bản thiết kế"
 upgrade_blueprint_stealing_desc:0 "§LChúng ta biết rằng kẻ thù có các dự án bí mật về vũ khí và phương tiện thử nghiệm, điều chúng ta không biết chính xác là những dự án đó là gì và họ đang chế tạo gì. Bằng cách xâm nhập các phòng vũ khí thử nghiệm của kẻ thù, chúng ta không chỉ có cơ hội tìm hiểu chính xác những gì họ định sử dụng chống lại chúng ta, mà còn được trao cơ hội độc đáo để sử dụng thông tin này để phát triển phòng vũ khí của chính chúng ta.§!"
 upgrade_portable_radios:0 "Radio cầm tay"
 upgrade_portable_radios_desc:0 "§LCác thiết bị liên lạc radio thông thường quá lớn và cố định để có thể hữu ích trong môi trường bí mật, nhưng bằng cách chế tạo phiên bản nhỏ gọn của công nghệ này và ngụy trang nó thành các vật dụng gia đình thông thường như cặp xách, các đặc vụ của chúng ta sẽ có thể liên lạc mọi lúc trong ngày mà không gây nghi ngờ hay báo động.§!"
 upgrade_invisible_ink:0 "Mực ẩn"
 upgrade_invisible_ink_desc:0 "§LMột lá thư viết bằng mực ẩn chỉ là một tờ giấy trắng với mắt thường, nhưng việc áp dụng ánh sáng UV hoặc hóa chất như amoniac sẽ tiết lộ nội dung của lá thư. Bằng cách tiêu chuẩn hóa việc sử dụng mực ẩn của tất cả điệp viên, thông tin của chúng ta sẽ vẫn bí mật ngay cả khi bị kẻ thù chặn bắt.§!"
 upgrade_plastic_explosives:0 "Thuốc nổ dẻo"
 upgrade_plastic_explosives_desc:0 "§LKết cấu giống như bột nhão của thuốc nổ dẻo khiến chúng trở nên lý tưởng để phá hoại sản xuất của kẻ thù nên việc trang bị cho du kích nước ngoài loại chất này là điều tự nhiên. Các quả bom có thể dễ dàng được đặt ngoài tầm nhìn và ở những khu vực dễ tổn thương của nhà máy địch, và tính chất dẻo dai của chất này sẽ khiến nó trở thành vũ khí lý tưởng trong một vụ ám sát chính trị ngoạn mục...§!"
 upgrade_suicide_pills:0 "Viên thuốc tự sát"
 upgrade_suicide_pills_desc:0 "§LDù không mong muốn, việc một số đặc vụ bị kẻ thù bắt giữ là điều không thể tránh khỏi. Chúng ta phải cung cấp cho các điệp viên một cách để tránh khỏi nỗi kinh hoàng đang chờ đợi họ trong phòng thẩm vấn, và một viên thuốc xyanua thay thế một chiếc răng sẽ cung cấp cho họ lối thoát đó, nếu điều đó xảy ra.§!"
 upgrade_training_centers:0 "Trung tâm huấn luyện địa phương"
 upgrade_training_centers_desc:0 "§LDù các đặc vụ của chúng ta có thể thích ứng với bất kỳ môi trường nào, các chuẩn mực văn hóa và ngôn ngữ của vùng đất nước ngoài sẽ tự nhiên hơn đối với những người sinh ra và lớn lên trong nền văn hóa đó. Nếu chúng ta muốn xây dựng mạng lưới gián điệp toàn cầu, chúng ta phải mở rộng các trung tâm tuyển dụng và huấn luyện trên khắp thế giới và tuyển dụng đặc vụ từ mọi nền văn hóa và xuất thân.§!"
 upgrade_commando_training:0 "Huấn luyện đặc công"
 upgrade_commando_training_desc:1 "§LDù phòng ban của chúng ta thường xử lý các khía cạnh tinh tế hơn của chiến tranh, thường thì một đội nhỏ binh lính trang bị hạng nặng là điều cần thiết để hoàn thành các hoạt động của chúng ta. Bằng cách huấn luyện tất cả điệp viên về phương pháp chiến tranh đặc công, họ sẽ trở nên hiệu quả hơn trong các hoạt động phá hoại, ít có khả năng bị phát hiện bởi phản tình báo địch và có khả năng hơn trong việc thu giữ thiết bị mật mã của kẻ thù.§!"
 upgrade_interrogation_techniques:0 "Kỹ thuật thẩm vấn"
 upgrade_interrogation_techniques_desc:0 "§LThường thì việc phá vỡ tinh thần của một đặc vụ địch có thể hiệu quả hơn việc phá vỡ thể xác họ. Việc sử dụng vũ lực không đáng tin cậy và thường dẫn đến thông tin sai lệch; một thẩm vấn viên thực sự có kỹ năng có khả năng phá vỡ ý chí của kẻ thù mà không cần bạo lực. Nhưng, nếu đến mức đó, chúng ta có cách để bắt họ nói...§!"
 upgrade_diplo_training:0 "Huấn luyện Ngoại giao"
 upgrade_diplo_training_desc:0 "§LHuấn luyện các đặc vụ của chúng ta để bôi trơn lòng bàn tay của một số nhà đầu tư và nhà ngoại giao nước ngoài có thể thuyết phục họ về lòng nhân từ của mục đích chúng ta và điều hướng lợi ích của họ khỏi các kẻ thù của nhà nước.§!"
 upgrade_psycho_warfare:0 "Chiến tranh Tâm lý"
 upgrade_psycho_warfare_desc:0 "§LTuyên truyền đã là công cụ hiệu quả trong việc bảo đảm lợi ích tư tưởng của chúng ta trong chính quốc gia mình, nhưng không công cụ nào hiệu quả bằng việc truyền bá nỗi sợ hãi về các chế độ địch và những gì chúng có thể mang đến cho đất nước. Bằng cách liên minh các đặc vụ của chúng ta với các phong trào chống tư tưởng trong các quốc gia ngoại bang, chúng ta sẽ trở nên hiệu quả hơn nhiều trong việc truyền bá tư tưởng của chúng ta trên toàn thế giới...§!"
 upgrade_form_department:0 "Thành lập Phòng ban"
 upgrade_form_department_desc:0 "§LMật mã học là phương pháp tạo ra mã và mật mã để duy trì liên lạc bí mật. Không có mã cần thiết, một thông điệp được viết bằng mật mã có thể gần như không thể hiểu được. Việc mã hóa dữ liệu của chúng ta cũng quan trọng như việc giải mã dữ liệu của kẻ thù.§!"
 upgrade_decryption_boost:1 "Nhóm Chặn bắt Radio"
 upgrade_decryption_boost_desc:0 "§LSóng radio đã giúp việc liên lạc từ xa qua khoảng cách dài trở nên khả thi, và tín hiệu thường được mã hóa bằng cách thay đổi liên tục tần số phát sóng với tốc độ bất thường. Nếu chúng ta muốn chặn bắt liên lạc của kẻ thù, chúng ta phải thành lập một nhóm chặn bắt chuyên dụng để phá vỡ mã hóa radio của kẻ thù.§!"
 upgrade_decryption_boost_2:1 "Giải mã Hỗ trợ Máy móc"
 upgrade_decryption_boost_2_desc:0 "§LMáy móc đã chứng minh hữu ích trong việc mã hóa dữ liệu, với các tín hiệu được mã hóa bằng máy chứng minh khó giải mã nhất. Máy phân tích mật mã rất quan trọng trong việc phá vỡ các thông điệp mà chúng ta chưa biết mã và sẽ là tài sản quý giá cho đội giải mã của chúng ta.§!"
 upgrade_crypto_strength:1 "Trường Mật mã Chính phủ"
 upgrade_crypto_strength_desc:0 "§LMã và mật mã cho đến nay đã chứng minh là cách hiệu quả nhất để thiết lập và bảo vệ mạng lưới gián điệp của chúng ta ở nước ngoài. Tổng cục Liên lạc Chính phủ sẽ dành công sức cho việc tạo ra các phương pháp mã hóa mới và phức tạp mà kẻ thù sẽ bất lực trong việc giải mã.§!"
 upgrade_crypto_strength_2:0 "Mã hóa Hỗ trợ Máy móc"
 upgrade_crypto_strength_2_desc:0 "§LRõ ràng rằng phương pháp tiêu chuẩn tạo mật mã của chúng ta không đủ để bảo vệ liên lạc khỏi con mắt của kẻ thù. Những bộ óc tinh anh nhất của chúng ta đã lý thuyết hóa một cỗ máy có thể xáo trộn các chữ cái trong bảng chữ cái để tạo ra mật mã mới với tần suất thường xuyên như chúng ta mong muốn. Triển khai công nghệ như vậy sẽ làm cho các phương pháp mã hóa của chúng ta trở thành một ẩn số hoàn toàn đối với kẻ thù.§!"
