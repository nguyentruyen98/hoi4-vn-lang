 operation_jericho_failure_tt: "Đột kích là thảm họa hoàn toàn, không tù nhân nào trốn thoát được. Kiểm soát của địch trong khu vực tăng lên"
 operation_jericho_limited_success_tt: "Cuộc ném bom táo bạo đã thổi một lỗ hổng trên tường nhà tù. Tuy nhiên, nhiều tù nhân bị thương và/hoặc không trốn thoát được."
 operation_jericho_success_tt: "Cuộc ném bom táo bạo đã thổi một lỗ hổng lớn trên tường nhà tù. Một số tù nhân bị thương hoặc không trốn thoát được, nhưng một số đáng kể đã trốn thoát và được phong trào kháng chiến địa phương đón."
 operation_jericho_critical_success_tt: "Cuộc ném bom táo bạo đã thổi một lỗ hổng khổng lồ trên tường nhà tù mà không làm thương tích bất kỳ tù nhân nào. Hầu hết tù nhân đã trốn thoát và được phong trào kháng chiến địa phương đón."

 operation_huansheng_failure_tt: "Đột kích là thảm họa hoàn toàn, không máy bay ném bom nào đến được khu vực thả được chỉ định, và nhiều chiếc bị bắn hạ bởi phòng không hải quân."
 operation_huansheng_limited_success_tt: "Cuộc ném bom táo bạo đã phân phát truyền đơn trên hầu hết các thành phố được chỉ định. Tuy nhiên, hầu hết bị rải rác ở những khu vực khó tiếp cận và nhanh chóng bị lực lượng địch dọn dẹp."
 operation_huansheng_success_tt: "Cuộc ném bom táo bạo đã phân phát truyền đơn trên tất cả các thành phố được chỉ định. Một số truyền đơn bị rải rác trên mái nhà hoặc trong khu vực rừng, nhưng phần lớn rơi ở những khu vực dễ tiếp cận và đông dân, và nhanh chóng được cư dân địa phương nhặt lên."
 operation_huansheng_critical_success_tt: "Cuộc ném bom táo bạo đã phân phát truyền đơn trên tất cả các thành phố được chỉ định. Tất cả đều rơi ở những khu vực dễ tiếp cận và đông dân, và nhanh chóng được cư dân địa phương nhặt lên, lan truyền tin tức về cuộc xâm lược của Nhật khắp nơi."


