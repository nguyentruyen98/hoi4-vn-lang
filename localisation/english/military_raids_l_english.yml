 tooltip_raid_category_air_raids: "§HĐột kích ném bom từ trên không§! \nCác cuộc tấn công từ trên không bởi một đơn vị không quân nhằm tấn công một mục tiêu cụ thể."
 tooltip_raid_category_nuclear_raids: "§HĐột kích hạt nhân§! \nCác cuộc tấn công được thực hiện bởi máy bay ném bom chiến lược hoặc tên lửa đạn đạo mang đầu đạn hạt nhân."
 tooltip_raid_category_paratrooper_raids: "§HĐột kích lính dù§! \nCác cuộc đột kích quy mô nhỏ được thực hiện bởi lực lượng đặc biệt nhảy dù xuống sau tuyến địch, để thực hiện các nhiệm vụ phá hoại nguy hiểm."
 tooltip_raid_category_naval_commando_raids: "§HĐột kích đặc công thủy quân lục chiến§! \nCác cuộc đột kích quy mô nhỏ được thực hiện bởi thủy quân lục chiến tại các khu vực ven biển, sử dụng thuyền cao tốc nhỏ và thiết bị tương tự để thực hiện tấn công nhanh rồi biến mất trước khi địch kịp phản ứng."
