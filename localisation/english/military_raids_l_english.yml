 tooltip_launch_button_enabled: "§GNhấp§! để khởi động đột kích"
 tooltip_launch_button_disabled: "§RĐột kích chưa sẵn sàng khởi động§!"
 tooltip_for_expand_button: "§GNhấp§! để mở rộng"
 tooltip_for_collapse_button: "§GNhấp§! để thu gọn"
 tooltip_for_no_items: "§RKhông có vật phẩm§!"
 raid_type_facility_strike: "Tấn công cơ sở"
 raid_type_facility_strike_desc: "Một cuộc không kích nhằm vào cơ sở thí nghiệm của địch với mục tiêu gây thiệt hại nghiêm trọng cho cơ sở và bất kỳ dự án nào ở đó."
 
 raid_type_lock_bombing_raid: "Đột kích ném bom cống"
 raid_type_lock_bombing_raid_desc: "Máy bay được trang bị bom nảy đặc biệt cố gắng phá hủy các cống, nhằm ngăn cản việc đi qua kênh đào."
 raid_type_lock_bombing_raid_no_bba: "$raid_type_lock_bombing_raid$"
 raid_type_lock_bombing_raid_no_bba_desc: "$raid_type_lock_bombing_raid_desc$"
 
 raid_type_dam_bombing_raid: "Đột kích ném bom đập"
 raid_type_dam_bombing_raid_desc: "Máy bay được trang bị bom nảy đặc biệt cố gắng phá hủy đập, làm giảm hiệu quả của nó và khiến địch khó di chuyển trong khu vực."
 raid_type_dam_bombing_raid_no_bba: "$raid_type_dam_bombing_raid$"
 raid_type_dam_bombing_raid_no_bba_desc: "$raid_type_dam_bombing_raid_desc$"
 
 raid_type_gun_emplacement_raid: "Tấn công vị trí pháo"
 raid_type_gun_emplacement_raid_desc: "Một phi đội máy bay ném bom được trang bị bom địa chấn cố gắng phá hủy vị trí đặt của $mega_gun_emplacement$"
 raid_type_gun_emplacement_raid_no_bba: "$raid_type_gun_emplacement_raid$"
 raid_type_gun_emplacement_raid_no_bba_desc: "$raid_type_gun_emplacement_raid_desc$"

 raid_type_mega_gun_emplacement_strike: "Tấn công vị trí siêu pháo"
 raid_type_mega_gun_emplacement_strike_desc: "Một cuộc tấn công vào vị trí siêu pháo sử dụng bom địa chấn"
 raid_type_mega_gun_emplacement_strike_no_bba: "$raid_type_mega_gun_emplacement_strike$"
 raid_type_mega_gun_emplacement_strike_no_bba_desc: "$raid_type_mega_gun_emplacement_strike_desc$"

 raid_type_oilfield_raid: "Đột kích mỏ dầu"
 raid_type_oilfield_raid_desc: "Một cuộc không kích nhằm phá hủy mỏ dầu lớn và các nhà máy lọc dầu liên quan, nhằm làm gián đoạn nghiêm trọng việc sản xuất nhiên liệu của địch trong thời gian dài."
 raid_type_nuclear_strike: "Tấn công hạt nhân"
 raid_type_nuclear_strike_desc: "Một máy bay ném bom chiến lược và hộ tống sẽ bay đến mục tiêu được chỉ định và triển khai bom nguyên tử. Sau đó máy bay ném bom sẽ cố gắng thoát khỏi khu vực để tránh bị cuốn vào sóng nổ."
 raid_type_nuclear_missile_strike: "Tấn công tên lửa hạt nhân"
 raid_type_nuclear_missile_strike_desc: "Một tên lửa tầm xa sẽ theo quỹ đạo đạn đạo cận quỹ đạo từ địa điểm phóng được chỉ định hướng tới mục tiêu dự định. Vào thời điểm thích hợp, đầu đạn trên tàu sẽ kích nổ một vụ nổ nguyên tử."
 raid_type_paratrooper_facility_sabotage: "Đột kích phá hoại cơ sở"
 raid_type_paratrooper_facility_sabotage_desc: "Một đội lính dù nhảy xuống cơ sở của địch và cố gắng phá hủy thiết bị quan trọng bằng thuốc nổ định hình, nhằm làm gián đoạn tiến độ khoa học của họ."
 raid_type_mine_sabotage_raid: "Đột kích phá hoại mỏ"
 raid_type_mine_sabotage_raid_desc: "Một đội lính dù nhảy xuống khu mỏ lớn của địch và cố gắng kích nổ các quả nổ sẽ làm gián đoạn sản xuất trong thời gian dài."
 raid_type_pathfinder_raid: "Đột kích thám đường"
 raid_type_pathfinder_raid_desc: "Một đội lính dù nhảy xuống sau tuyến địch để chuẩn bị cho cuộc xâm lược sắp tới bằng cách phá hủy các cây cầu quan trọng, thiết lập phục kích và tạo ra những mối phân tâm nói chung"
 raid_type_commando_port_raid: "Đột kích cảng thủy quân"
 raid_type_commando_port_raid_desc: "Một nhóm thủy quân lục chiến được gửi đi để phá hủy một $naval_base$ lớn do địch kiểm soát. Các tàu trong cảng cũng có thể bị thiệt hại."
 raid_type_commando_facility_raid: "Đột kích cơ sở thủy quân"
 raid_type_commando_facility_raid_desc: "Một nhóm thủy quân lục chiến được gửi đi để phá hủy cơ sở thí nghiệm trong một tỉnh ven biển."
 raid_type_airfield_raid: "Đột kích sân bay"
 raid_type_supply_hub_raid: "Đột kích trung tâm tiếp tế"
 raid_type_demo_dam_raid: "Đột kích phá đập thử nghiệm"
 raid_type_AUS_reichstag_bombing: "Đột kích ném bom Reichstag"
 raid_type_AUS_reichstag_bombing_desc: "Bằng cách gửi một nhóm máy bay ném bom tấn công trụ sở chính của địch và nơi tượng trưng cho quyền lực của Đức, chúng ta có thể nâng cao tinh thần của người dân đồng thời gây tổn hại cho địch."
 raid_type_ENG_reichstag_bombing: "Đột kích ném bom Reichstag"
 raid_type_ENG_reichstag_bombing_desc: "Bằng cách gửi một nhóm máy bay ném bom tấn công trụ sở chính của địch và nơi tượng trưng cho quyền lực của Đức, chúng ta có thể nâng cao tinh thần của người dân đồng thời gây tổn hại tinh thần của địch."
 raid_type_GER_eben_emael_raid: "Đột kích Eben Emael"
 raid_type_GER_eben_emael_raid_desc: "Một đội tấn công bão táp gồm lính dù và binh sĩ tàu lượn sẽ tấn công pháo đài đặt ở vị trí chiến lược từ trên cao, cũng như chiếm giữ các cây cầu, đường bộ và đường sắt quan trọng trong khu vực để mở đường cho lực lượng tấn công chính."
 raid_type_GER_big_ben_bombing: "Đột kích ném bom Big Ben"
 raid_type_GER_statue_of_liberty_bombing: "Đột kích ném bom Tượng Nữ thần Tự do"
 raid_type_GER_kremlin_bombing: "Đột kích ném bom Kremlin"
 raid_type_ENG_operation_jericho: "Chiến dịch Jericho"
 raid_type_ENG_operation_jericho_desc: "Dựa trên thông tin từ phong trào kháng chiến Pháp, Đức đang giam giữ một số lượng lớn chiến sĩ kháng chiến bị bắt tại Amiens. Bằng cách gửi một phi đội máy bay để thổi một lỗ hổng trong tường nhà tù, chúng ta sẽ có thể giải phóng một số lượng lớn những chiến sĩ kháng chiến đó."
 raid_type_thermonuclear_strike: "Tấn công nhiệt hạch"
 raid_type_thermonuclear_strike_desc: "Một máy bay ném bom chiến lược và hộ tống sẽ bay đến mục tiêu được chỉ định và triển khai bom nhiệt hạch. Sau đó máy bay ném bom sẽ cố gắng thoát khỏi khu vực để tránh bị cuốn vào sóng nổ."
 raid_type_thermonuclear_missile_strike: "Tấn công tên lửa nhiệt hạch"
 raid_type_thermonuclear_missile_strike_desc: "Một tên lửa tầm xa sẽ theo quỹ đạo đạn đạo cận quỹ đạo từ địa điểm phóng được chỉ định hướng tới mục tiêu dự định. Vào thời điểm thích hợp, đầu đạn trên tàu sẽ kích nổ một vụ nổ nhiệt hạch."
 raid_type_CHI_huansheng_raid: "Chiến dịch Hoàn Sinh"
 raid_type_CHI_huansheng_raid_desc: "Tình báo của chúng ta cho biết rằng mặc dù là những mục tiêu có giá trị, nhà máy thép Yawata và Xưởng hải quân Sasebo quá khó khăn để không quân của chúng ta có thể tấn công hiệu quả vào thời điểm này. Do đó, cách hiệu quả nhất để chấm dứt cuộc chiến này là đánh thức lương tâm của người dân Nhật chống lại những tội ác do những kẻ hiếu chiến đế quốc Nhật gây ra ở Trung Quốc, bằng cách thả truyền đơn trên các thành phố như Nagasaki, Fukuoka, Saga và Osaka."

