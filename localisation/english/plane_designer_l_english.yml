 AIR_TITLE_MOTHERSHIP: "Máy bay mẹ"
 AIR_TITLE_MOTHERSHIP_DESC: "Máy bay mẹ là loại máy bay lớn được thiết kế để mang theo và triển khai các máy bay nhỏ hơn vào chiến đấu, mở rộng đáng kể tầm hoạt động của chúng vượt xa khả năng của từng tiêm kích hoạt động độc lập."
