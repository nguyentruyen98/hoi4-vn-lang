 cv_small_plane_suicide_airframe_4_desc:0 "$small_plane_airframe_4_desc$"
 medium_plane_airframe_0:0 "Khung máy bay trung liên chiến"
 medium_plane_airframe_0_desc:0 "Mặc dù có thể mang tải trọng đáng kể trên quãng đường dài, tiềm năng phát triển của khung máy bay này bị hạn chế nghiêm trọng."
 medium_plane_airframe_1:0 "Khung máy bay trung cơ bản"
 medium_plane_airframe_1_desc:0 "Tích hợp một số công nghệ mới được phát triển gần đây, khung máy bay này có khả năng vượt trội đáng kể so với các máy bay có kích thước tương tự trước đây."
 medium_plane_airframe_2:0 "Khung máy bay trung cải tiến"
 medium_plane_airframe_2_desc:0 "Tận dụng công nghệ sản xuất hiện đại, khung máy bay này cho phép máy bay mang tải trọng lớn hơn trên quãng đường xa hơn."
 medium_plane_airframe_3:0 "Khung máy bay trung tiên tiến"
 medium_plane_airframe_3_desc:0 "Được thiết kế để tối đa hóa hiệu suất và tải trọng, khung máy bay này thể hiện đỉnh cao của máy bay chạy động cơ thông thường."
 medium_plane_airframe_4:0 "Khung máy bay trung hiện đại"
 medium_plane_airframe_4_desc:0 "Với máy bay chạy động cơ phản lực có khả năng trở thành chủ đạo, các kỹ sư đang bắt đầu tìm hiểu cách chế tạo khung máy bay với động cơ phản lực."
