 medium_plane_scout_plane_airframe_4:0 "Máy bay trinh sát hiện đại"
 medium_plane_scout_plane_airframe_4_desc:0 "$medium_plane_airframe_4_desc$"
 large_plane_airframe_0:0 "Khung máy bay lớn liên chiến"
 large_plane_airframe_0_desc:0 "Khung máy bay rất lớn này có nhiều không gian để chở bom hoặc bình nhiên liệu. Tuy nhiên, rõ ràng tiềm năng phát triển của nó bị hạn chế nghiêm trọng. Thế hệ máy bay ném bom chiến lược mới đã xuất hiện ở chân trời."
 large_plane_airframe_1:0 "Khung máy bay lớn cơ bản"
 large_plane_airframe_1_desc:0 "Khung máy bay này được thiết kế để thử nghiệm tiềm năng của một máy bay ném bom chiến lược thực thụ, có thể tấn công mục tiêu công nghiệp sâu bên trong lãnh thổ địch và đưa phi hành đoàn trở về an toàn."
 large_plane_airframe_2:0 "Khung máy bay lớn cải tiến"
 large_plane_airframe_2_desc:0 "Với khái niệm máy bay ném bom chiến lược giờ đã được chứng minh rõ, khung máy bay này được thiết kế để cải thiện tải trọng và tầm hoạt động, đồng thời có đủ tiềm năng phát triển trong tương lai."
 large_plane_airframe_3:0 "Khung máy bay lớn tiên tiến"
 large_plane_airframe_3_desc:0 "Được tối ưu hóa cho bay tầm xa rất lớn ở độ cao rất cao, khung máy bay này có khả năng mang tải trọng đáng kể vào sâu trong trung tâm lãnh thổ địch."
 large_plane_airframe_4:0 "Khung máy bay lớn hiện đại"
 large_plane_airframe_4_desc:0 "Động cơ phản lực mang lại bước nhảy vọt về hiệu suất. Khung máy bay này được thiết kế để tận dụng điều này."
 large_plane_maritime_patrol_plane_airframe_0:0 "Máy bay tuần tra hải quân liên chiến"
 large_plane_maritime_patrol_plane_airframe_0_desc:1 "Hạm đội cần máy bay tầm xa để tìm kẻ thù xa bờ. Mặc dù hơi lỗi thời, khung máy bay này cung cấp tầm hoạt động cần thiết để bao phủ vùng biển rộng lớn."
 large_plane_maritime_patrol_plane_airframe_1:0 "Máy bay tuần tra hải quân cơ bản"
 large_plane_maritime_patrol_plane_airframe_1_desc:0 "Sự xuất hiện của máy bay tàu sân bay mạnh hơn khiến việc tìm và tiêu diệt hạm đội địch xa bờ trở thành điều cần thiết. Bước đầu tiên là tìm chúng xa ngoài đại dương, đòi hỏi một loại máy bay mới."
 large_plane_maritime_patrol_plane_airframe_2:0 "Máy bay tuần tra hải quân cải tiến"
 large_plane_maritime_patrol_plane_airframe_2_desc:0 "Mối đe dọa kép từ tàu ngầm và tuần dương hạm đột kích đòi hỏi tuần tra vùng biển rộng lớn. Khung máy bay này được tối ưu hóa cho mục đích này."
 large_plane_maritime_patrol_plane_airframe_3:0 "Máy bay tuần tra hải quân tiên tiến"
 large_plane_maritime_patrol_plane_airframe_3_desc:0 "Radar và các cảm biến khác cho phép tìm hạm đội địch ngay cả trong thời tiết xấu hoặc đêm tối, nhưng tất cả thiết bị mới đòi hỏi khung máy bay lớn hơn để chở chúng."
 large_plane_maritime_patrol_plane_airframe_4:0 "Khung máy bay tuần tra hải quân hiện đại"
 large_plane_maritime_patrol_plane_airframe_4_desc:0 "Với bình minh của thời đại tên lửa, máy bay tuần tra hải quân phải có khả năng hoạt động xa bờ hơn nữa và trong thời gian lâu hơn."
 cv_small_plane_airframe_0:0 "Khung máy bay tàu sân bay liên chiến"
 cv_small_plane_airframe_0_desc:0 "Được trang bị móc hãm và càng đáp cứng cáp, khung máy bay này có khả năng hoạt động từ tàu sân bay."
 cv_small_plane_airframe_1:0 "Khung máy bay tàu sân bay cơ bản"
 cv_small_plane_airframe_1_desc:0 "Tích hợp công nghệ mới được phát triển cho máy bay trên đất liền, khung máy bay này có khả năng tương đương nhưng có thể phóng từ boong tàu sân bay."
 cv_small_plane_airframe_2:0 "Khung máy bay tàu sân bay cải tiến"
 cv_small_plane_airframe_2_desc:0 "Để theo kịp phát triển trong hàng không trên đất liền, khung máy bay này được thiết kế với công nghệ mới để tăng tầm hoạt động và hiệu suất."
 cv_small_plane_airframe_3:0 "Khung máy bay tàu sân bay tiên tiến"
 cv_small_plane_airframe_3_desc:0 "Bản chất khắt khe của hàng không tàu sân bay hạn chế khung máy bay có thể lớn và có khả năng đến mức nào. Khung máy bay này thể hiện mức tối đa tuyệt đối có thể đạt được với khung máy bay chạy động cơ thông thường."
 cv_small_plane_airframe_4:0 "Khung máy bay tàu sân bay hiện đại"
 cv_small_plane_airframe_4_desc:0 "Khung máy bay này được thiết kế để tận dụng lực đẩy gia tăng từ động cơ phản lực và đưa chúng vào hàng không hải quân."
