 modern_medium_airframe_desc:0 "$medium_plane_airframe_4_desc$"
 large_plane_airframe:1 "$strat_bomber_equipment$"
 large_plane_airframe_desc:0 "Khung máy bay lớn với nhiều không gian, có khả năng gắn đến sáu động cơ và mang tải trọng lớn trên quãng đường dài."
 large_plane_maritime_patrol_plane_airframe:2 "Máy bay ném bom tuần tra hải quân"
 large_plane_maritime_patrol_plane_airframe_desc:0 "$large_plane_airframe_desc$"
