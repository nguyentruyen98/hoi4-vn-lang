 modern_large_airframe_desc:0 "$large_plane_airframe_4_desc$"
 early_bombs:0 "Bom"
 early_bombs_desc:0 "Từ những ngày đầu của Đại chiến, máy bay ngày càng được sử dụng để thả chất nổ lên mục tiêu địch. Theo thời gian, điều này ngày càng phát triển thành khía cạnh cơ bản của chiến tranh trên không."
 heavy_bombs:0 "Bom nặng"
 heavy_bombs_desc:0 "Chiến tranh hiện đại đòi hỏi máy bay ngày càng sử dụng bom lớn hơn trên mục tiêu địch. Theo thời gian, điều này ngày càng phát triển thành khía cạnh cơ bản của chiến tranh trên không."
 armor_piercing_bombs:0 "Bom xuyên giáp"
 armor_piercing_bombs_desc:0 "Tàu chiến đã liên tục tăng cường giáp boong để đánh bại điều này, loại bom chuyên dụng phải được phát triển để xuyên thủng lớp giáp này."
 air_torpedoe_1:0 "Ngư lôi phóng từ không"
 air_torpedoe_1_desc:0 "Ngư lôi hạng nhẹ có thể được mang bởi bất kỳ máy bay có khả năng nào để mở rộng khả năng tấn công trên biển của chúng ta."
 air_torpedoe_2:0 "Ngư lôi phóng từ không cải tiến"
 air_torpedoe_2_desc:0 "Giá gắn và định mức tiêu chuẩn cho phép phát triển ngư lôi lớn hơn, mạnh hơn cũng như tăng tính tiện dụng chung của chúng."
 air_torpedoe_3:0 "Ngư lôi phóng từ không tiên tiến"
 air_torpedoe_3_desc:0 "Sự phát triển của phụ kiện hạng nhẹ được thiết kế để rơi ra khi vào nước giúp ngư lôi không quân có độ chính xác cao hơn đáng kể cũng như tăng cường an toàn cho máy bay thực hiện thả."
 photo_reconnaisance:1 "Trinh sát chụp ảnh"
 photo_reconnaisance_desc:0 "Mục đích quân sự rõ ràng đầu tiên của máy bay là tìm kẻ thù và báo cáo vị trí của chúng cho các Tướng lĩnh trên mặt đất. Đây vẫn là một trong những nhiệm vụ phổ biến nhất của hàng không quân sự."
 aa_lmg:0 "Súng máy hạng nhẹ"
 aa_lmg_desc:0 "Súng máy cỡ nòng rifle đã tạo thành nòng cốt của vũ khí không-không từ thời Đại chiến."
 survivability_studies:0 "Nghiên cứu khả năng sống sót"
 survivability_studies_desc:0 "Bằng cách phân tích cẩn thận thiệt hại chiến đấu trên máy bay trở về, chúng ta có thể xác định chính xác bộ phận nào của máy bay thực sự quan trọng."
 aircraft_construction:0 "Chế tạo máy bay"
 aircraft_construction_desc:0 "Chúng ta đã đi một chặng đường dài từ thời đại gỗ dán và vải trong sản xuất máy bay. Công nghệ mới cho phép chế tạo máy bay phù hợp hơn cho vai trò cụ thể."
 aa_hmg:0 "Súng máy hạng nặng"
 aa_hmg_desc:0 "Máy bay hiện đại có khả năng chịu đựng sát thương đáng kể hơn các mẫu cũ, đồng thời cung cấp ít cơ hội hơn để ghi điểm trúng đích. Do đó mỗi phát trúng phải gây sát thương tối đa, đòi hỏi đạn lớn hơn."
 aa_cannon_1:0 "Pháo I"
 aa_cannon_1_desc:0 "Đạn pháo có thể xuyên thủng ngay cả máy bay cứng cáp nhất, đồng thời có thể mang đủ chất nổ để gây thiệt hại tàn phá khi trúng đích."
 aa_cannon_2:0 "Pháo lớn"
 aa_cannon_2_desc:0 "Với cỡ nòng cao hơn và đạn lớn hơn, những khẩu pháo này có thể hạ gục ngay cả máy bay lớn chỉ trong một phát bắn."
 aa_cannon_3:0 "Pháo II"
 aa_cannon_3_desc:0 "Với khẩu pháo hiện đại bắn đạn lớn với vận tốc cao, chúng ta có thể hạ gục ngay cả máy bay cứng cáp nhất."
 engines_1:0 "Động cơ I"
 engines_1_desc:0 "Động cơ máy bay phải mạnh mẽ nhưng nhẹ và đáng tin cậy. Loại động cơ này cung cấp đủ sức mạnh để đưa máy bay lên không nhưng hơi hạn chế khả năng đạt tiềm năng tối đa."
 engines_2:0 "Động cơ II"
 engines_2_desc:0 "Sự phát triển nhanh chóng của máy bay đòi hỏi sự tăng trưởng tương ứng về sức mạnh động cơ."
 engines_3:0 "Động cơ III"
 engines_3_desc:0 "$engine_3_1x_desc$"
 engines_4:0 "Động cơ IV"
 engines_4_desc:0 "$engine_4_1x_desc$"
 range_improvements:0 "Cải tiến tầm hoạt động"
 range_improvements_desc:0 "Mặc dù có vẻ hiển nhiên rằng thêm dung tích nhiên liệu sẽ tăng tầm hoạt động của máy bay, thực tế việc thêm dung tích đó vào máy bay mà không ảnh hưởng quá nhiều đến hiệu suất bay là điều không hề đơn giản."

 sp_centrifugal_jet_tech: "Động cơ phản lực ly tâm"
 sp_centrifugal_jet_tech_desc: "Động cơ phản lực ly tâm sử dụng máy nén một tầng để nén không khí đầu vào, trước khi phun ra để tạo lực đẩy. Điều này tạo ra động cơ nhỏ hơn, dễ bảo trì hơn."
 jet_engine_axial_1x: "1x Động cơ phản lực trục"
 jet_engine_axial_1x_desc: "Gắn nhiều máy nén liên tiếp nhau, Động cơ trục có khả năng nhân lên lượng lực đẩy được tạo ra bởi động cơ phản lực một tầng đơn giản."
