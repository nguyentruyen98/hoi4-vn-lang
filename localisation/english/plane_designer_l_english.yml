 engine_1_1x:0 "1x Động cơ I"
 engine_1_1x_desc:0 "Động cơ cơ bản này đáng tin cậy và rẻ tiền, nhưng không đặc biệt mạnh mẽ."
 engine_1_2x:0 "2x Động cơ I"
 engine_1_2x_desc:0 "Động cơ kép mang lại cho máy bay sự gia tăng đáng kể về lực đẩy, nhưng phải trả giá."
 engine_1_3x:0 "3x Động cơ I"
 engine_1_3x_desc:0 "Ba động cơ tạo ra lực đẩy nhiều hơn hai động cơ, mà không tốn thêm chi phí của động cơ thứ tư."
 engine_1_4x:0 "4x Động cơ I"
 engine_1_4x_desc:0 "Bốn động cơ cung cấp đủ lực đẩy để nâng một máy bay nặng và cho phép nó mang tải trọng đáng kể."
 engine_1_6x:0 "6x Động cơ I"
 engine_1_6x_desc:0 "Với sáu động cơ, bất kỳ máy bay nào cũng có thể mang tải trọng đáng kể trên quãng đường dài, ở tốc độ hợp lý."
 engine_2_1x:0 "1x Động cơ II"
 engine_2_1x_desc:0 "Động cơ lớn hơn và mạnh mẽ hơn cho phép tốc độ cao hơn và tải trọng lớn hơn."
 engine_2_2x:0 "2x Động cơ II"
 engine_2_2x_desc:0 "$engine_1_2x_desc$"
 engine_2_3x:0 "3x Động cơ II"
 engine_2_3x_desc:0 "$engine_1_3x_desc$"
 engine_2_4x:0 "4x Động cơ II"
 engine_2_4x_desc:0 "$engine_1_4x_desc$"
 engine_2_6x:0 "6x Động cơ II"
 engine_2_6x_desc:0 "$engine_1_6x_desc$"
 engine_3_1x:0 "1x Động cơ III"
 engine_3_1x_desc:0 "Kết hợp các tính năng tiên tiến như phun methanol và hỗn hợp tự động, động cơ này có thể tạo ra công suất lớn hơn đáng kể."
 engine_3_2x:0 "2x Động cơ III"
 engine_3_2x_desc:0 "$engine_1_2x_desc$"
 engine_3_3x:0 "3x Động cơ III"
 engine_3_3x_desc:0 "$engine_1_3x_desc$"
 engine_3_4x:0 "4x Động cơ III"
 engine_3_4x_desc:0 "$engine_1_4x_desc$"
 engine_3_6x:0 "6x Động cơ III"
 engine_3_6x_desc:0 "$engine_1_6x_desc$"
 engine_4_1x:0 "1x Động cơ IV"
 engine_4_1x_desc:0 "Với kỹ thuật mở rộng để tận dụng mọi cải tiến hiệu suất có thể, động cơ này đại diện cho đỉnh cao tuyệt đối của công nghệ động cơ piston."
 engine_4_2x:0 "2x Động cơ IV"
 engine_4_2x_desc:0 "$engine_1_2x_desc$"
 engine_4_3x:0 "3x Động cơ IV"
 engine_4_3x_desc:0 "$engine_1_3x_desc$"
 engine_4_4x:0 "4x Động cơ IV"
 engine_4_4x_desc:0 "$engine_1_4x_desc$"
 engine_4_6x:0 "6x Động cơ IV"
 engine_4_6x_desc:0 "$engine_1_6x_desc$"
 jet_engine_1x:0 "1x Động cơ phản lực"
 jet_engine_1x_desc:0 "Với cách tiếp cận hoàn toàn khác để vận hành máy bay, động cơ phức tạp và khó tính này vẫn mang lại sự gia tăng lớn về lực đẩy và tốc độ."
 jet_engine_2x:0 "2x Động cơ phản lực"
 jet_engine_2x_desc:0 "$engine_1_2x_desc$"
 jet_engine_3x:0 "3x Động cơ phản lực"
 jet_engine_3x_desc:0 "$engine_1_3x_desc$"
 jet_engine_4x:0 "4x Động cơ phản lực"
 jet_engine_4x_desc:0 "$engine_1_4x_desc$"
 jet_engine_6x:0 "6x Động cơ phản lực"
 jet_engine_6x_desc:0 "$engine_1_6x_desc$"
 rocket_engine_1:0 "Động cơ tên lửa I"
 rocket_engine_1_desc:0 "Sử dụng một số nhiên liệu rất dễ bay hơi và chất oxy hóa không ổn định tương tự, động cơ này có khả năng tạo ra lượng lực đẩy rất lớn để đẩy máy bay đến tốc độ cao, với cái giá là tầm hoạt động."
 rocket_engine_2:0 "Động cơ tên lửa II"
 rocket_engine_2_desc:0 "Cải tiến trong buồng đốt và những thay đổi nhỏ trong hỗn hợp nhiên liệu cho phép hiệu suất thậm chí cao hơn, với sự giảm tương ứng về tầm hoạt động."
 rocket_engine_3:0 "Động cơ tên lửa III"
 rocket_engine_3_desc:0 ""

 light_mg_2x:0 "2x Súng máy hạng nhẹ"
 light_mg_2x_desc:0 "Một bộ hai súng máy cỡ nòng rifle tăng thêm một chút hỏa lực chống mục tiêu trên không với chi phí rất vừa phải."
 light_mg_4x:0 "4x Súng máy hạng nhẹ"
 light_mg_4x_desc:0 "Bộ bốn súng máy cỡ nòng rifle này thiếu sức công phá nhưng bù lại bằng khối lượng hỏa lực thuần túy."
 aircraft_cannon_1_1x:0 "1x Pháo I"
 aircraft_cannon_1_1x_desc:0 "Một khẩu pháo tự động mang lại lượng hỏa lực đáng kể chống mục tiêu trên không, nhưng trọng lượng tăng thêm khiến máy bay chậm hơn và kém cơ động hơn."
 aircraft_cannon_1_2x:0 "2x Pháo I"
 aircraft_cannon_1_2x_desc:0 "Hai khẩu pháo tự động trang bị cho máy bay vũ khí bắn thẳng đáng sợ chống mục tiêu trên không và mục tiêu mềm trên mặt đất, với chi phí đáng kể về trọng lượng và tính cơ động."
 bomb_locks:0 "Giá treo bom"
 bomb_locks_desc:0 "Giá gắn bom nhỏ dưới cánh hoặc thân máy bay cho phép máy bay tấn công mục tiêu mặt đất với hy vọng thành công."
 heavy_bomb_locks:0 "Giá treo bom nặng"
 heavy_bomb_locks_desc:0 "Giá gắn bom lớn dưới cánh hoặc thân máy bay cho phép máy bay tấn công mục tiêu mặt đất với hiệu quả lớn."
 armor_piercing_bomb_locks:0 "Giá treo bom xuyên giáp"
 armor_piercing_bomb_locks_desc:0 "Giá gắn bom xuyên giáp lớn dưới cánh hoặc thân máy bay cho phép máy bay tấn công mục tiêu hải quân với hiệu quả lớn."
 torpedo_mounting:0 "Giá gắn ngư lôi hạng nhẹ"
 torpedo_mounting_desc:0 "Điểm gắn cứng cho phép ngư lôi hạng nhẹ được gắn dưới thân máy bay. Điều này trang bị cho máy bay vũ khí mạnh mẽ để sử dụng chống tàu thù."
 torpedo_mounting_2:0 "Giá gắn ngư lôi hạng trung"
 torpedo_mounting_2_desc:0 "Điểm gắn cứng cho phép ngư lôi hạng trung được gắn dưới thân máy bay. Điều này trang bị cho máy bay vũ khí mạnh mẽ để sử dụng chống tàu thù."
 torpedo_mounting_3:0 "Giá gắn ngư lôi hạng nặng"
 torpedo_mounting_3_desc:0 "Điểm gắn cứng cho phép ngư lôi hạng nặng được gắn dưới thân máy bay. Điều này trang bị cho máy bay vũ khí mạnh mẽ để sử dụng chống tàu thù."
 armor_plate_small:0 "Tấm giáp"
 armor_plate_small_desc:0 "Tấm thép phía sau ghế phi công và xung quanh động cơ tăng khả năng sống sót của máy bay trước hỏa lực mặt đất và tấn công từ phía sau."
 heavy_mg_2x:0 "2x Súng máy hạng nặng"
 heavy_mg_2x_desc:0 "Một cặp súng máy hạng nặng cho phép xuyên thủng lớp vỏ ngoài cứng cáp của máy bay hiện đại."
 heavy_mg_4x:0 "4x Súng máy hạng nặng"
 heavy_mg_4x_desc:0 "Bộ bốn súng máy hạng nặng mang lại hỏa lực khủng khiếp, cả về hiệu suất cá thể lẫn khối lượng hỏa lực thuần túy."
 aircraft_cannon_2_1x:0 "1x Pháo II"
 aircraft_cannon_2_1x_desc:0 "Một khẩu pháo hiện đại bắn đạn lớn với vận tốc cao, vũ khí này có thể hạ gục cả tiêm kích lẫn máy bay ném bom chiến lược."
 aircraft_cannon_2_2x:0 "2x Pháo II"
 aircraft_cannon_2_2x_desc:0 "Pháo đôi trang bị cho máy bay lực công phá đáng kể, trong khi khối lượng hỏa lực tăng khiến việc gây sát thương tàn phá trở nên dễ dàng hơn."
 large_aircraft_cannon_1x:0 "1x Pháo lớn"
 large_aircraft_cannon_1x_desc:0 "Bắn đạn lớn hơn và mạnh hơn so với các thế hệ pháo tự động trước đây nhưng với vận tốc chậm hơn, vũ khí này có thể hạ gục cả khung máy bay lớn chỉ trong một phát bắn."
 large_aircraft_cannon_2x:0 "2x Pháo lớn"
 large_aircraft_cannon_2x_desc:0 "Pháo đôi trang bị cho máy bay lực công phá đáng kể, trong khi khối lượng hỏa lực tăng khiến việc gây sát thương tàn phá trở nên dễ dàng hơn."
 small_bomb_bay:0 "Khoang bom nhỏ"
 small_bomb_bay_desc:0 "Khoang nhỏ để chở bom. Việc đặt bên trong thân máy bay giảm lực cản, nhưng những thay đổi cấu trúc cần thiết có nghĩa là máy bay không thể thực hiện cơ động quyết liệt trong chiến đấu trên không."
 medium_bomb_bay:0 "Khoang bom trung"
 medium_bomb_bay_desc:0 "Khoang bom cỡ trung cho phép mang đủ vũ khí để tấn công nhiều loại mục tiêu khác nhau."
 large_bomb_bay:0 "Khoang bom lớn"
 large_bomb_bay_desc:0 "Khoang lớn để chở đủ vũ khí phá hủy hoặc thiệt hại ngay cả các nhà máy rộng lớn và mục tiêu cứng khác."
 tank_buster_1:0 "Pháo chống tăng I"
 tank_buster_1_desc:0 "Được cải tiến từ pháo chống tăng của Lục quân, khẩu pháo này có thể tiêu diệt ngay cả xe tăng hiện đại bằng những phát bắn chuẩn xác. Tuy nhiên, trọng lượng nặng và cấu trúc vụng về làm hạn chế nghiêm trọng hiệu suất máy bay."
 tank_buster_2:0 "Pháo chống tăng II"
 tank_buster_2_desc:0 "Những xe tăng nặng hơn hiện tại đòi hỏi khẩu pháo lớn hơn nhiều để chiến đấu. Mặc dù cực kỳ nặng và khó điều khiển, nó rất có khả năng như một vũ khí tấn công các vị trí địch."
 fuel_tanks_small:0 "Bình nhiên liệu phụ"
 fuel_tanks_small_desc:0 "Dành thêm không gian bên trong khung máy bay cho nhiên liệu tăng tầm hoạt động của máy bay, nhưng cũng khiến máy bay dễ cháy hơn nhiều."
 self_sealing_fuel_tanks_small:1 "Bình nhiên liệu tự bịt"
 self_sealing_fuel_tanks_small_desc:0 "Bằng cách thêm lớp cao su xử lý đặc biệt xung quanh bình nhiên liệu, một phát bắn trúng bình nhiên liệu sẽ không làm tê liệt máy bay vì bình sẽ tự bịt theo thời gian, ngăn mất nhiên liệu."
 armor_plate_medium:0 "$armor_plate_small$"
 armor_plate_medium_desc:0 "Giáp xung quanh động cơ và các bộ phận mỏng manh hơn của thân máy bay tăng đáng kể khả năng sống sót của máy bay, với cái giá là tầm hoạt động."
 fuel_tanks_medium:0 "$fuel_tanks_small$"
 fuel_tanks_medium_desc:0 "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_medium:0 "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_medium_desc:0 "$self_sealing_fuel_tanks_small_desc$"
 armor_plate_large:0 "$armor_plate_small$"
 armor_plate_large_desc:0 "Tấm thép rộng rãi bảo vệ động cơ, bình nhiên liệu và khoang phi hành đoàn cho phép máy bay chịu đựng mọi thứ trừ trúng đạn trực tiếp từ hỏa lực phòng không, đồng thời trở thành mục tiêu rất khó bắn hạ đối với tiêm kích."
 fuel_tanks_large:0 "$fuel_tanks_small$"
 fuel_tanks_large_desc:0 "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_large:0 "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_large_desc:0 "$self_sealing_fuel_tanks_small_desc$"
 lmg_defense_turret:0 "Tháp pháo phòng thủ súng máy nhẹ"
 lmg_defense_turret_desc:0 "Mặc dù hơi yếu trong chiến đấu không-không, một khẩu súng máy nhẹ trong tháp pháo sẽ khiến mọi cuộc tấn công vào máy bay này trở thành việc nguy hiểm hơn."
 lmg_defense_turret_2x:0 "Tháp pháo phòng thủ súng máy nhẹ 2x"
 lmg_defense_turret_2x_desc:0 "Một bộ hai súng máy nhẹ trong tháp pháo chạy điện che phủ nhiều góc độ hơn và khiến máy bay trở thành mục tiêu khó tấn công hơn nhiều."
 hmg_defense_turret:0 "Tháp pháo phòng thủ súng máy nặng"
 hmg_defense_turret_desc:0 "Một khẩu súng máy nặng trong tháp pháo xoay cho phép người phòng thủ đáp trả tiêm kích trang bị vũ khí tương tự với hy vọng thành công nào đó."
 hmg_defense_turret_2x:0 "Tháp pháo phòng thủ súng máy nặng 2x"
 hmg_defense_turret_2x_desc:0 "Một bộ hai tháp pháo chạy điện với súng máy nặng khiến mọi tiêm kích tấn công đều đối mặt với mục tiêu nguy hiểm."
 cannon_defense_turret:0 "Tháp pháo phòng thủ"
 cannon_defense_turret_desc:0 "Một khẩu pháo hiện đại trong tháp pháo xoay được thay đổi đáng kể cán cân quyền lực giữa người phòng thủ và kẻ tấn công trong chiến đấu trên không. Ít tiêm kích có thể chịu được một phát trúng trực tiếp từ pháo hiện đại và tiếp tục chiến đấu."
 cannon_defense_turret_2x:0 "Tháp pháo phòng thủ 2x"
 cannon_defense_turret_2x_desc:0 "Hai tháp pháo trang bị pháo tự động trang bị cho máy bay sức công phá phòng thủ đáng sợ khiến mọi cuộc tấn công của tiêm kích vào nó đều trở thành triển vọng rất nguy hiểm."
 rocket_rails:0 "Ray tên lửa"
 rocket_rails_desc:0 "Đạn không dẫn đường treo dưới cánh. Vì chúng được bắn trước mặt máy bay tấn công, phi công dễ dàng ngắm chúng vào mục tiêu hơn so với bom."
 bomb_sights_1:0 "Thước ngắm bom I"
 bomb_sights_1_desc:0 "Một máy tính cơ học phức tạp tính đến độ lệch gió, vận tốc cuối và độ cao cho phép người ném bom thả bom với độ chính xác cao."
 bomb_sights_2:0 "Thước ngắm bom II"
 bomb_sights_2_desc:0 "Trong khi các thế hệ thước ngắm bom trước thường đòi hỏi quá trình thiết lập dài trước khi đưa ra giải pháp ngắm, thước ngắm bom ổn định hoàn toàn này chỉ mất vài giây và thậm chí có thể bù trừ cho lao xuống nông."
 radio_navigation_1:0 "Định vị vô tuyến I"
 radio_navigation_1_desc:0 "Máy thu vô tuyến nghe việc giao cắt của hai chùm định vị vô tuyến khá đơn giản, giúp có thể tìm mục tiêu ngay cả trong bóng tối hoàn toàn."
 radio_navigation_2:0 "Định vị vô tuyến II"
 radio_navigation_2_desc:0 "Máy thu vô tuyến cũng bao gồm một số thiết bị đo khoảng cách, báo cho người ném bom thời điểm chính xác cần thả bom, ngay cả khi anh ta không thể thấy mục tiêu."
 air_ground_radar_1:0 "Radar không-đất I"
 air_ground_radar_1_desc:0 "Bộ radar trên không cung cấp cho người dẫn đường hình ảnh chính xác về bề mặt bên dưới máy bay, cho phép dẫn đường chính xác ngay cả trong bóng tối hoặc thời tiết xấu."
 air_ground_radar_2:0 "Radar không-đất II"
 air_ground_radar_2_desc:0 "Với độ phân giải cao hơn các mẫu trước, bộ radar này cho phép ném bom chính xác ngay cả qua lớp mây che phủ."
 air_air_radar_1:0 "Radar không-không I"
 air_air_radar_1_desc:0 "Một bộ ăng-ten radar trên máy bay cho phép nhân viên được đào tạo tìm mục tiêu trên không ngay cả trong bóng tối."
 air_air_radar_2:0 "Radar không-không II"
 air_air_radar_2_desc:0 "Với máy phát mạnh hơn, bộ radar này có thể phát hiện mục tiêu ở khoảng cách xa hơn."
 non_strategic_materials_small:0 "Sử dụng vật liệu phi chiến lược"
 non_strategic_materials_small_desc:0 "Bằng cách thay thế gỗ hoặc vải xử lý đặc biệt cho nhôm bất cứ nơi nào có thể, chúng ta có thể giảm mạnh việc sử dụng vật liệu chiến lược. Tuy nhiên, gỗ và vải không chịu được vũ khí hiện đại."
 drop_tanks:0 "Bình xăng phụ"
 drop_tanks_desc:0 "Những bình xăng nhỏ, dùng một lần chứa nhiên liệu phụ tăng thêm tầm hoạt động cho tiêm kích khi thực hiện nhiệm vụ tấn công. Vì được thả trước chiến đấu, chúng không cản trở hiệu suất chiến đấu."
 dive_brakes_small:0 "Phanh lao"
 dive_brakes_small_desc:1 "Một bộ cánh phá dọc theo mép sau cánh triển khai khi máy bay lao xuống, giảm tốc độ tổng thể và cho phép máy bay thoát khỏi lao xuống dốc mà không xé rách cánh. Điều này cho phép máy bay tấn công từ lao xuống gần thẳng đứng, tăng mạnh độ chính xác."
 non_strategic_materials_medium:0 "$non_strategic_materials_small$"
 non_strategic_materials_medium_desc:0 "$non_strategic_materials_small_desc$"
 non_strategic_materials_large:0 "$non_strategic_materials_small$"
 non_strategic_materials_large_desc:0 "$non_strategic_materials_small_desc$"
 floats:0 "Phao nổi"
 floats_desc:0 "Một bộ thiết bị nổi gắn dưới khung máy bay cho phép máy bay hạ cánh trên nước. Điều này khiến nhiệm vụ trinh sát tài sản hải quân địch dễ dàng hơn, nhưng cũng giảm mạnh tính cơ động."
 flying_boat_medium:0 "Thủy phi cơ"
 flying_boat_medium_desc:0 "Thay vì gắn bánh hạ cánh, mặt dưới máy bay có thể được tạo hình để có thể hạ cánh trên nước. Điều này khiến nhiệm vụ trinh sát trên nước dễ dàng hơn nhiều."
 flying_boat_large:0 "$flying_boat_medium$"
 flying_boat_large_desc:0 "$flying_boat_medium_desc$"
 guided_anti_ship_missile:1 "Tên lửa chống hạm dẫn đường"
 guided_anti_ship_missile_desc:0 "Thực chất là bom chống hạm với động cơ tên lửa và dẫn đường vô tuyến, vũ khí chiến tranh mới này là mối đe dọa nghiêm trọng cho tất cả tàu hiện đang hoạt động."
 bouncing_bomb_release: "Cơ chế thả bom nảy"
 bouncing_bomb_release_desc: "Giá treo bom để mang và thả bom nảy đặc biệt, trượt trên mặt nước cho đến khi trúng mục tiêu. Cơ chế khiến bom quay ngược lại trong quá trình thả, tăng khả năng chạm vào mục tiêu cấu trúc dự định."
 earthshaker_bomb_release: "Cơ chế thả bom rung chấn đất"
 earthshaker_bomb_release_desc: "Giá treo bom và cơ chế thả cho những quả bom rung chấn đất khổng lồ được thiết kế để xuyên vào đất khi va chạm và nổ dưới lòng đất, gây thiệt hại cấu trúc lớn cho mục tiêu."
 rocket_propelled_bombs: "Bom đẩy tên lửa"
 rocket_propelled_bombs_desc: "Bom không dẫn đường đẩy bằng tên lửa có thể gây thiệt hại đáng kể cho tàu và các mục tiêu lớn có giáp tương tự."
 improved_rocket_propelled_bombs: "Bom đẩy tên lửa nặng"
 improved_rocket_propelled_bombs_desc: "Bom đẩy tên lửa không dẫn đường lớn hơn, mang tải trọng nặng hơn, có thể xuyên thủng mục tiêu hiệu quả hơn nữa."

 fixed_explosive_charge:0 "Trang bị nổ cố định"
 fixed_explosive_charge_desc:0 "Một trang bị nổ rỗng cố định biến máy bay thành quả bom bay. Nếu máy bay được lái đâm vào tàu địch, nó sẽ gây ra sự tàn phá kinh hoàng, nhưng với cái giá là cả máy bay và phi hành đoàn đều bị mất."
 recon_camera:0 "Camera trinh sát"
 recon_camera_desc:0 "Một bộ camera với ống kính đặc biệt, cho phép máy bay chụp ảnh chính xác các đội hình và cơ sở địch ngay cả từ độ cao lớn."
 airdropped_mines:0 "Mìn thả từ không"
 airdropped_mines_desc:0 "Một bộ mìn hải quân được trang bị dù, cho phép chúng được thả từ máy bay."
 demining_coil:0 "Cuộn dây dò mìn"
 demining_coil_desc:0 "Một cuộn dây lớn gắn trên khung máy bay cho phép máy bay tạo ra từ trường mạnh, khiến các quả mìn từ tính trên đường bay nổ tung."

 small_plane_airframe_0:0 "Khung máy bay nhỏ đời đầu"
 small_plane_airframe_0_desc:0 "Từ những ngày đầu của Đại chiến, ngành hàng không đã tiến bộ vượt bậc. Khung máy bay này thể hiện đỉnh cao của những phát triển đó, nhưng rõ ràng là tiềm năng phát triển của nó có hạn."
 small_plane_airframe_1:0 "Khung máy bay nhỏ cơ bản"
 small_plane_airframe_1_desc:0 "Trong những năm gần đây, một số công nghệ mới đã xuất hiện, cho phép chế tạo những chiếc máy bay rất có khả năng nhưng vẫn nhỏ gọn. Khung máy bay này chỉ là bước đầu tiên trên con đường đó."
 small_plane_airframe_2:0 "Khung máy bay nhỏ cải tiến"
 small_plane_airframe_2_desc:0 "Với khí động học được cải thiện và cấu trúc vững chắc hơn, khung máy bay này thể hiện bước tiến rõ ràng so với mẫu cơ bản."
 small_plane_airframe_3:0 "Khung máy bay nhỏ tiên tiến"
 small_plane_airframe_3_desc:0 "Được tối ưu hóa triệt để về hiệu suất, khung máy bay này thể hiện giới hạn tuyệt đối của những gì có thể làm được với máy bay chạy động cơ piston."
 small_plane_airframe_4:0 "Khung máy bay nhỏ hiện đại"
 small_plane_airframe_4_desc:0 "Khung máy bay này được thiết kế để tận dụng tốc độ lớn do động cơ hiện đại cung cấp và giải quyết một số vấn đề cấu trúc phát sinh khi bay ở tốc độ cận âm cao."

 small_plane_airframe_5: "Khung máy bay nhỏ siêu âm"
 small_plane_airframe_5_desc: "Khung máy bay tiên tiến này, có khả năng bay siêu âm Mach 1, thể hiện đỉnh cao của kỹ thuật con người"
